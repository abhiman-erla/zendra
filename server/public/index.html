<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zendra — Ask your codebase</title>
<style>
  :root {
    --bg: #0a0908;
    --bg-glow: radial-gradient(ellipse 900px 500px at 50% -10%, rgba(212, 175, 55, 0.10), transparent 60%);
    --panel: #131110;
    --panel-alt: #17140f;
    --border: #2a2620;
    --border-soft: #201d18;
    --text: #f2ead9;
    --muted: #9a9184;
    --muted-dim: #6e675c;
    --gold: #d4af37;
    --gold-bright: #f2d675;
    --gold-dim: #8c7127;
    --gold-soft: rgba(212, 175, 55, 0.10);
    --gold-border: rgba(212, 175, 55, 0.35);
    --error: #d47a4a;
    --mono: "SF Mono", "Cascadia Code", Consolas, monospace;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
  }

  * { box-sizing: border-box; }

  ::selection { background: var(--gold-soft); color: var(--gold-bright); }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--gold-dim); }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg-glow), var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 64px 20px;
  }

  main {
    width: 100%;
    max-width: 720px;
  }

  header {
    margin-bottom: 36px;
  }

  .wordmark {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 10px;
  }

  .wordmark .rule {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--gold-border), transparent);
  }

  h1 {
    font-family: var(--serif);
    font-size: 2rem;
    font-weight: 400;
    letter-spacing: 0.06em;
    margin: 0;
    background: linear-gradient(135deg, var(--gold-bright) 0%, var(--gold) 55%, var(--gold-dim) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.92rem;
    margin: 0;
    letter-spacing: 0.01em;
  }

  form {
    display: flex;
    gap: 10px;
  }

  input[type="text"] {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input[type="text"]::placeholder {
    color: var(--muted-dim);
  }

  input[type="text"]:focus {
    border-color: var(--gold-dim);
    box-shadow: 0 0 0 3px var(--gold-soft);
  }

  button {
    background: linear-gradient(135deg, var(--gold-bright), var(--gold) 60%, var(--gold-dim));
    color: #16130a;
    border: none;
    border-radius: 10px;
    padding: 0 24px;
    font-size: 0.92rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: filter 0.2s, box-shadow 0.2s, transform 0.1s;
    box-shadow: 0 4px 16px rgba(212, 175, 55, 0.15);
  }

  button:hover:not(:disabled) {
    filter: brightness(1.08);
    box-shadow: 0 4px 20px rgba(212, 175, 55, 0.28);
  }

  button:active:not(:disabled) {
    transform: translateY(1px);
  }

  button:disabled {
    opacity: 0.45;
    cursor: default;
    box-shadow: none;
  }

  #result {
    margin-top: 32px;
  }

  .state {
    color: var(--muted);
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .dots span {
    display: inline-block;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--gold);
    margin-right: 3px;
    animation: pulse 1.1s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: 0.15s; }
  .dots span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
    40% { opacity: 1; transform: scale(1); }
  }

  .error {
    color: var(--error);
    font-size: 0.9rem;
    background: rgba(212, 122, 74, 0.08);
    border: 1px solid rgba(212, 122, 74, 0.25);
    border-radius: 10px;
    padding: 14px 16px;
  }

  .answer {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--border-soft);
    border-left: 2px solid var(--gold-dim);
    border-radius: 4px 12px 12px 4px;
    padding: 22px 24px;
    line-height: 1.7;
    font-size: 0.96rem;
    white-space: pre-wrap;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
  }

  .answer strong {
    color: var(--gold-bright);
    font-weight: 600;
  }

  .answer code {
    font-family: var(--mono);
    font-size: 0.85em;
    background: var(--panel-alt);
    border: 1px solid var(--border-soft);
    color: var(--gold-bright);
    padding: 1px 6px;
    border-radius: 4px;
  }

  .sources {
    margin-top: 20px;
  }

  .sources h2 {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--gold-dim);
    font-weight: 700;
    margin: 0 0 10px;
  }

  .source-chip {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 10px 14px;
    background: var(--panel-alt);
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    margin-bottom: 6px;
    font-family: var(--mono);
    font-size: 0.8rem;
    transition: border-color 0.15s, background 0.15s;
  }

  .source-chip:hover {
    border-color: var(--gold-border);
    background: var(--gold-soft);
  }

  .source-chip .kind {
    color: var(--gold);
    flex-shrink: 0;
  }

  .source-chip .name {
    color: var(--text);
  }

  .source-chip .loc {
    color: var(--muted-dim);
    margin-left: auto;
    flex-shrink: 0;
  }

  footer {
    margin-top: 48px;
    text-align: center;
    color: var(--muted-dim);
    font-size: 0.78rem;
    letter-spacing: 0.03em;
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="wordmark">
      <h1>Zendra</h1>
      <div class="rule"></div>
    </div>
    <p class="subtitle">Ask a natural-language question about the ingested codebase.</p>
  </header>

  <form id="ask-form">
    <input type="text" id="question" placeholder="e.g. where is authentication handled?" autocomplete="off" />
    <button type="submit" id="submit-btn">Ask</button>
  </form>

  <div id="result"></div>

  <footer>AST-aware chunking · hybrid search · cited answers</footer>
</main>

<script>
  const form = document.getElementById("ask-form");
  const input = document.getElementById("question");
  const button = document.getElementById("submit-btn");
  const result = document.getElementById("result");

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  // Claude's answers use light markdown (bold, inline code) — render just
  // those two, escaping first so nothing in the answer text can inject HTML.
  function renderAnswer(str) {
    return escapeHtml(str)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    button.disabled = true;
    result.innerHTML = '<p class="state">Thinking <span class="dots"><span></span><span></span><span></span></span></p>';

    try {
      const res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
      const data = await res.json();

      if (!res.ok) {
        result.innerHTML = `<p class="error">${escapeHtml(data.error || "Something went wrong.")}</p>`;
        return;
      }

      const sourcesHtml = data.sources
        .map(
          (s) => `<div class="source-chip">
            <span class="kind">[${escapeHtml(s.kind)}]</span>
            <span class="name">${escapeHtml(s.name)}</span>
            <span class="loc">${escapeHtml(s.filePath)}:${s.startLine}-${s.endLine}</span>
          </div>`
        )
        .join("");

      result.innerHTML = `
        <div class="answer">${renderAnswer(data.answer)}</div>
        <div class="sources">
          <h2>Sources</h2>
          ${sourcesHtml}
        </div>
      `;
    } catch (err) {
      result.innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
